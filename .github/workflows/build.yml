name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# read-only unless a job says otherwise; only the release job below can write
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        shell: cmd
        env:
          LOAFLOCK_BUILD: ${{ github.sha }}
        run: build.cmd test

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash bin\LoafLock.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LoafLock.exe" | Out-File bin\LoafLock.exe.sha256 -Encoding ascii
          Get-Content bin\LoafLock.exe.sha256
          (Get-Item bin\LoafLock.exe).VersionInfo.ProductVersion

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LoafLock
          path: |
            bin/LoafLock.exe
            bin/LoafLock.exe.sha256

  # a version tag (v0.9, v1.0, ...) drafts a release from the build above; publishing the
  # draft stays a person's job
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LoafLock
          path: bin

      # the exe says "0.8+abc1234": the version is the part before the "+"
      - name: The tag must match the exe's version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = (Get-Item bin\LoafLock.exe).VersionInfo.ProductVersion.Split('+')[0]
          if ($tag -ne $exe) { Write-Error "Tag $env:GITHUB_REF_NAME doesn't match LoafLock.exe's version $exe"; exit 1 }
          "tag and exe agree: $exe"

      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME bin/LoafLock.exe bin/LoafLock.exe.sha256 --repo $env:GITHUB_REPOSITORY --draft --title "LoafLock $env:GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed. Windows may say it protected your PC: click More info, then Run anyway (LoafLock isn't code-signed). LoafLock.exe.sha256 holds its SHA-256."
